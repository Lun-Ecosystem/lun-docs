name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - name: Repository checks (files, lengths, addresses, registry, ADRs, versions)
        run: npm run check
      - name: Standards copies in sync
        run: npm run sync:check
      - name: Plugin and marketplace validation
        run: |
          npx -y @anthropic-ai/claude-code@2.1.303 plugin validate --strict .
          npx -y @anthropic-ai/claude-code@2.1.303 plugin validate --strict plugin
          npx -y @anthropic-ai/claude-code@2.1.303 plugin validate --strict plugin/agents
          npx -y @anthropic-ai/claude-code@2.1.303 plugin validate --strict plugin/skills
      # Everything above runs before any install: the root stays without dependencies. design/ has its own.
      - name: Kit and gallery (install, types, tests, format, build)
        working-directory: design
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run format:check
          npm run build
