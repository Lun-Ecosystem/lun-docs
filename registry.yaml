# =============================================================================
# Registre des projets de l'écosystème Lun'
#
# Source de vérité sur : quels projets existent, leur rôle, leur dépôt, leur état.
# Ce dépôt est PUBLIC : aucune adresse interne (IP du NAS, Tailscale, domaines privés),
# aucun secret. Ces valeurs vivent dans les .env non versionnés des projets.
#
# Champs obligatoires par projet :
#   id          identifiant court, en minuscules
#   nom         nom affiché (« Lun'Xxx »)
#   role        core | satellite | vitrine | referentiel (un seul core)
#   depot       owner/nom sur GitHub
#   visibilite  public | prive
#   etat        actif | en-dev | en-pause | archive
# Champs optionnels : description, stack, contrats (ce que le projet expose au core).
#
# Vérifié par : npm run check
# Un projet s'ajoute ici à sa création ; les id reprennent ceux du website, qui lit ce fichier au build.
# =============================================================================
version: 1

projets:
  - id: lun-docs
    nom: "Lun'Docs"
    role: referentiel
    depot: Lun-Ecosystem/lun-docs
    visibilite: public
    etat: actif
    description: "Référentiel commun : normes, méthode, registre et plugin Claude Code lun."

  - id: website
    nom: "Lun'Ecosystem (site)"
    role: vitrine
    depot: CrOliX-AltF4/website
    visibilite: prive
    etat: actif
    description: "Vitrine FR/EN de l'écosystème et de Natsume."

  - id: lunanima
    nom: "Lun'Anima"
    role: core
    depot: Lun-Ecosystem/lun-anima
    visibilite: prive
    etat: en-dev
    description: "Le core : Natsume, la mémoire de sa relation, sa conversation et son app (PWA, au bureau et au téléphone)."

  - id: lunacedia
    nom: "Lun'Acedia"
    role: satellite
    depot: Lun-Ecosystem/lun-acedia
    visibilite: public
    etat: en-dev
    description: "Serveur de la journée : mail, agenda et tâches Google, triés à la source, avec son agent."

  - id: lunavaritia
    nom: "Lun'Avaritia"
    role: satellite
    depot: Lun-Ecosystem/lun-avaritia
    visibilite: public
    etat: en-dev
    description: "Base de savoir de l'écosystème : fiches normalisées et reliées, faits sourcés, import et export Obsidian."

  - id: lunluxuria
    nom: "Lun'Luxuria"
    role: satellite
    depot: Lun-Ecosystem/lun-luxuria
    visibilite: public
    etat: en-dev
    description: "Un compagnon vocal de bureau : sa scène, sa voix, ce qu'il écoute. Seul sur un modèle, ou corps de Natsume relié au core (ADR 0009, 0010)."
